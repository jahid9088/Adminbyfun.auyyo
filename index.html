<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<title>FUN XPro Admin</title>
<style>
:root{
  --bg:#06070E;--panel:#0D1020;--panel2:#141838;--field:#080A18;
  --line:#1D2245;--line2:#2B3266;
  --txt:#E8EBFF;--dim:#8C94C2;--faint:#5C6596;
  --gold:#FFD21F;--ok:#19E3B1;--warn:#FFA928;--bad:#FF4D5E;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.45 var(--sans);min-height:100vh;
  background-image:radial-gradient(1000px 420px at 50% -140px,rgba(255,210,31,.08),transparent 70%);background-repeat:no-repeat}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── shell ── */
.shell{max-width:1200px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;padding:16px 0 12px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:18px;letter-spacing:.2px}
.brand span{display:block;font-size:12px;color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;
  background:var(--panel2);border:1px solid var(--line2);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--faint)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1A1300;font-weight:700}
.btn.gold:hover{background:#FFE04F}
.btn.danger{color:var(--bad);border-color:rgba(255,77,94,.45);background:rgba(255,77,94,.08)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#1F0006;font-weight:700}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:12px 14px;font-weight:600;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--txt);border-bottom-color:var(--gold)}
.tab small{margin-left:6px;font:600 11px var(--mono);color:var(--faint)}
.view{padding-top:16px}

/* ── fields ── */
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
.field>small{display:block;font-size:12px;color:var(--faint);margin-top:6px}
input[type=text],input[type=password],input[type=search],input[type=number],input[type=url],select,textarea{
  width:100%;min-height:46px;padding:10px 14px;background:var(--field);border:1px solid var(--line2);border-radius:12px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input::placeholder{color:var(--faint)}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--dim);margin:12px 0}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--gold);flex:0 0 auto}

/* ── users: filter chips + toolbar ── */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:baseline;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);font-weight:600;font-size:14px}
.chip b{font:700 14px var(--mono);color:var(--txt)}
.chip[aria-pressed=true]{border-color:var(--gold);color:var(--txt);background:rgba(255,210,31,.08)}
.chip.bad b{color:var(--bad)}
.chip.warn b{color:var(--warn)}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar .grow{flex:1;min-width:0}
.bar select{width:auto;flex:0 0 auto;min-width:112px}
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px;color:var(--dim);font-size:13px}

/* ── layout: list + detail ── */
.cols{display:block}
@media (min-width:960px){
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:24px;align-items:start}
  .detail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
}

/* ── user rows ── */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:5px minmax(0,1fr) auto;align-items:stretch;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:68px;transition:border-color .15s,background .15s}
.row:hover{background:var(--panel2)}
.row[aria-current=true]{border-color:var(--gold)}
.row .rail{background:var(--ok)}
.row.st-suspended .rail{background:var(--warn)}
.row.st-blocked .rail{background:var(--bad)}
.row.st-other .rail{background:var(--faint)}
.rmain{padding:12px 14px;min-width:0}
.rmain .n{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{font:700 17px var(--mono);letter-spacing:.3px;font-variant-numeric:tabular-nums}
.meta{display:block;font-size:12.5px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rside{padding:12px 14px 12px 0;text-align:right;display:flex;flex-direction:column;justify-content:center;gap:2px}
.bal{font:700 15px var(--mono)}
.stl{font-size:12px;font-weight:600;color:var(--ok)}
.st-suspended .stl{color:var(--warn)}.st-blocked .stl{color:var(--bad)}.st-other .stl{color:var(--dim)}
.tag{font:700 10.5px var(--sans);padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--dim)}
.tag.demo{color:var(--gold);border-color:rgba(255,210,31,.4)}
.tag.fix{color:var(--warn);border-color:rgba(255,169,40,.5)}
.pick{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);flex:0 0 auto;margin:auto 0 auto 12px}
.pick.on{background:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 0 4px var(--panel)}
.row.selmode{grid-template-columns:5px auto minmax(0,1fr) auto}
.more{margin:14px auto 0;display:flex}
.empty{padding:36px 16px;text-align:center;color:var(--dim);border:1px dashed var(--line2);border-radius:14px}
.empty b{display:block;color:var(--txt);margin-bottom:4px}

/* ── detail panel / sheet ── */
.scrim{position:fixed;inset:0;background:rgba(2,3,10,.72);z-index:30}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.detail.empty-d{display:none}
@media (max-width:959px){
  .detail{position:fixed;left:0;right:0;bottom:0;z-index:31;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));transform:translateY(0);animation:up .22s ease-out}
  .detail.empty-d{display:none}
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.detail{animation:none}*{transition:none!important}}
.dhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.dhead .num{font-size:22px;flex:1;word-break:break-all}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);color:var(--dim);font-size:20px;line-height:1;flex:0 0 auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
.seg button{min-height:44px;border-radius:10px;border:1px solid var(--line2);font-weight:600;font-size:14px;color:var(--dim)}
.seg button[aria-pressed=true].a{background:rgba(25,227,177,.14);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed=true].s{background:rgba(255,169,40,.14);border-color:var(--warn);color:var(--warn)}
.seg button[aria-pressed=true].b{background:rgba(255,77,94,.14);border-color:var(--bad);color:var(--bad)}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.sec>h3{font-size:13px;font-weight:700;color:var(--dim);margin-bottom:10px}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px 12px;font-size:14px}
.kv dt{color:var(--dim)}
.kv dd{min-width:0;word-break:break-all}
.kv dd.line{display:flex;gap:8px;align-items:center;justify-content:space-between}
.kv dd.line span{min-width:0;word-break:break-all}
.link{color:var(--gold);font-weight:600;font-size:13px;padding:6px 8px;border-radius:8px;flex:0 0 auto}
.warnbox{background:rgba(255,169,40,.08);border:1px solid rgba(255,169,40,.4);border-radius:12px;padding:12px;font-size:13.5px;color:#FFD9A0;margin-bottom:14px}
.warnbox .btn{margin-top:10px}
.hint{font-size:12.5px;color:var(--faint);margin:-6px 0 12px}

/* ── bulk bar ── */
.bulk{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(13,16,32,.97);border-top:1px solid var(--line2);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;overflow-x:auto}
.bulk .cnt{font:700 14px var(--mono);margin-right:auto;white-space:nowrap}

/* ── generic list rows (demo, deposits, logs) ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin-bottom:4px}
.card p{color:var(--dim);font-size:13.5px;margin-bottom:12px}
.line-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.line-row:first-child{border-top:0}
.line-row .grow{flex:1;min-width:0}
.line-row .t{font-size:13px;color:var(--dim)}
.pill{font:700 11px var(--sans);padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
.pill.on{color:var(--ok);border-color:rgba(25,227,177,.5)}
.pill.warn{color:var(--warn);border-color:rgba(255,169,40,.5)}
.pill.bad{color:var(--bad);border-color:rgba(255,77,94,.5)}
.sw{min-width:64px}
.logline{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.logline:first-child{border-top:0}
.logline .a{font:700 13px var(--mono)}
.logline .t{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.seg2{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border:1px solid var(--line2);border-radius:12px;margin-bottom:12px}
.seg2 button{min-height:36px;padding:0 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--dim)}
.seg2 button[aria-pressed=true]{background:var(--panel2);color:var(--txt)}

/* ── lock screen ── */
.lock{min-height:100vh;display:grid;place-items:center;padding:20px}
.lock .box{width:100%;max-width:380px}
.lock h1{font-size:24px;margin-bottom:4px}
.lock p{color:var(--dim);margin-bottom:22px}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin:8px 0}

/* ── modal + toast ── */
.mscrim{position:fixed;inset:0;background:rgba(2,3,10,.78);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:20px}
.modal h2{font-size:18px;margin-bottom:8px}
.modal p{color:var(--dim);font-size:14px;margin-bottom:14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);
  background:#171B3F;border:1px solid var(--line2);border-left:4px solid var(--ok);border-radius:12px;padding:12px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.bad{border-left-color:var(--bad)}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 2px}
.stat div{min-width:96px}
.stat b{display:block;font:700 20px var(--mono)}
.stat span{font-size:12.5px;color:var(--dim)}
@media (min-width:960px){
  .scrim{display:none}
  .detail.empty-d{display:block;text-align:center;color:var(--faint);padding:48px 20px}
}

/* ── single-file (direct) lock screen ── */
[hidden]{display:none!important}
.lock .box>.btn.block+.hint{margin-top:10px}
.lock .hint{color:var(--ok);font-size:13.5px;word-break:break-all;min-height:20px;margin:10px 0 4px}
details.alt{margin:12px 0}
details.alt>summary{cursor:pointer;color:var(--dim);font-size:14px;padding:8px 0;list-style:none}
details.alt>summary::-webkit-details-marker{display:none}
details.alt>summary::before{content:'+';display:inline-block;width:18px;color:var(--gold);font-weight:700}
details.alt[open]>summary::before{content:'−'}
details.alt textarea{margin-top:6px;font:12px var(--mono);min-height:110px}
.lock .link{display:block;margin:14px auto 0}

</style>
</head>

<script>
(function () {

// ───────────── tiny DOM helpers (all text goes through textContent: nothing from the database is ever parsed as HTML) ─────────────

  if (typeof o !== 'object') return [];
  return Object.keys(o).map(function (k) { return [k, o[k]]; });
}
function rs(v) { var n = Number(v); if (!isFinite(n)) n = 0; return '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 2 }); }

  return new Date(n).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function ago(ts) {
  var n = Number(ts); if (!n) return '';
  var s = Math.max(0, (Date.now() - n) / 1000);
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';

var toastT;

// ───────────── state ─────────────
// hosted = this same file uploaded to ordinary web hosting; it then talks to the Worker at the URL typed on the lock screen

};

var listRefresh = null;

// ───────────── storage of the password (this device only, only if you tick the box) ─────────────
function getStored() { try { return sessionStorage.getItem('fxa') || localStorage.getItem('fxa') || ''; } catch (e) { return ''; } }
function getBase() { try { return localStorage.getItem('fxu') || ''; } catch (e) { return ''; } }
function setBase(u) { try { localStorage.setItem('fxu', u); } catch (e) {} }

}

// ───────────── api ─────────────
function AuthErr() { this.auth = true; }
// ───────────── DIRECT MODE: this one page talks to Google + Firebase itself (no server, no PHP, no Worker) ─────────────

var DEFAULT_DB = 'https://lovemessge-default-rtdb.firebaseio.com';

var NUM = /^[0-9]{2,20}$/;

  function lab(t, el) { return h('label', { class: 'field' }, h('span', { text: t }), el); }

  add(detailEl, [
    h('div', { class: 'dhead' }, h('div', { class: 'num', text: n }),
      h('button', { class: 'btn sm', text: 'Copy', onclick: function () { copy(n, 'Number copied'); } }),
      h('button', { class: 'x', 'aria-label': 'Close details', text: '×', onclick: closeDetail })),
    fix, seg,
    h('div', { class: 'sec' }, h('h3', { text: 'Details' }), details),
    h('div', { class: 'sec' }, h('h3', { text: 'Edit' }),
      lab('Balance (rupees)', f.balance),
      h('p', { class: 'hint', text: 'Balance is a copy of the wallet on the site. The app overwrites it whenever this user opens the app.' }),
      lab('Password', f.code), lab('UID', f.uid), lab('Note', f.note), save),
    h('div', { class: 'sec' }, h('h3', { text: 'Danger zone' }),
      h('button', { class: 'btn danger block', text: 'Delete this user', onclick: function () { deleteUsers([n]); } }))
  ]);
}

function setStatus(nums, st) {
  var p = nums.length === 1 ? api('user/status', { number: nums[0], status: st }) : chunked(nums, 200, function (c) { return api('user/bulk', { numbers: c, action: 'status', status: st }); });
  return p.then(function () { toast(nums.length === 1 ? nums[0] + ' is now ' + statusLabel(st).toLowerCase() : nums.length + ' users set to ' + statusLabel(st).toLowerCase()); return reload(); }).catch(fail);
}
function chunked(arr, size, fn) {
  var i = 0;
  return (function next() { if (i >= arr.length) return Promise.resolve(); var c = arr.slice(i, i + size); i += size; return fn(c).then(next); })();
}
function deleteUsers(nums) {
  var one = nums.length === 1;
  ask({ title: one ? 'Delete ' + nums[0] + '?' : 'Delete ' + nums.length + ' users?',
    text: 'This removes the account from the app database. The person can register again, but starts fresh with zero balance. This cannot be undone. Download a backup first if unsure.',
    check: { label: 'Also delete their deposit requirement and deposit logs', on: true },
    type: one ? nums[0].slice(-4) : 'DELETE', confirm: one ? 'Delete user' : 'Delete ' + nums.length + ' users', danger: true
  }).then(function (a) {
    if (!a.ok) return;
    var p = one ? api('user/delete', { number: nums[0], history: a.check }) : chunked(nums, 200, function (c) { return api('user/bulk', { numbers: c, action: 'delete', history: a.check }); });
    p.then(function () { toast(one ? 'Deleted ' + nums[0] : 'Deleted ' + nums.length + ' users'); S.open = null; S.sel = {}; return reload(); }).catch(fail);
  });
}
function repair(nums) {
  var done = 0;
  return chunked(nums, 20, function (c) { return api('user/repair', { numbers: c }).then(function (r) { done += r.fixed || 0; }); })
    .then(function () { toast(done ? 'Fixed ' + done + (done === 1 ? ' record' : ' records') : 'Nothing needed fixing'); return reload(); }).catch(fail);
}
function addUserModal() {
  formModal({ title: 'Add user', text: 'Pre-register a number so it can log in to the app. They start with zero balance.',
    fields: [{ key: 'number', label: 'Mobile number', inputmode: 'numeric', placeholder: 'e.g. 9876543210', hint: '2 to 20 digits' }, { key: 'code', label: 'Password (optional)', placeholder: 'Saved for your reference' }],
    submit: 'Add user',
    onSubmit: function (v) { return api('user/create', { number: v.number.trim(), code: v.code }).then(function () { toast('Added ' + v.number.trim()); S.q = ''; S.filter = 'all'; return reload(); }); } });
}
function csvCell(v) {
  var s = v === undefined || v === null ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function download(name, text, type) {
  var a = h('a', { href: URL.createObjectURL(new Blob([text], { type: type })), download: name });
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCsv(list) {
  var cols = ['number', 'status', 'balance', 'password', 'uid', 'brand', 'deviceId', 'battery', 'joined', 'logins', 'note'];
  var lines = [cols.join(',')];
  list.forEach(function (u) {
    var r = u.r;
    lines.push([u.n, u.st, u.bal, r.code, r.uid, r.brand, r.deviceId, r.battery, u.created ? new Date(u.created).toISOString() : '', r.loginCount, r.note].map(csvCell).join(','));
  });
  download('users-' + new Date().toISOString().slice(0, 10) + '.csv', lines.join('\n'), 'text/csv');
  toast('Exported ' + list.length + ' users');
}
function renderBulk() {
  if (!bulkEl) return;
  bulkEl.textContent = '';
  if (S.tab !== 'users' || !S.selMode) return;
  var nums = Object.keys(S.sel), none = !nums.length;
  var vis = S.vis || [];
  add(bulkEl, h('div', { class: 'bulk' },
    h('span', { class: 'cnt', text: nums.length + ' selected' }),
    h('button', { class: 'btn sm', text: nums.length === vis.length && vis.length ? 'Clear' : 'Select all', onclick: function () { if (nums.length === vis.length) S.sel = {}; else { S.sel = {}; vis.forEach(function (u) { S.sel[u.n] = 1; }); } listRefresh(); } }),
    h('button', { class: 'btn sm', text: 'Activate', disabled: none, onclick: function () { setStatus(nums, 'ACTIVE'); } }),
    h('button', { class: 'btn sm', text: 'Suspend', disabled: none, onclick: function () { setStatus(nums, 'SUSPENDED'); } }),
    h('button', { class: 'btn sm', text: 'Block', disabled: none, onclick: function () { setStatus(nums, 'BLOCKED'); } }),
    h('button', { class: 'btn sm', text: 'Export', disabled: none, onclick: function () { exportCsv(S.users.filter(function (u) { return S.sel[u.n]; })); } }),
    h('button', { class: 'btn sm danger', text: 'Delete', disabled: none, onclick: function () { deleteUsers(nums); } })));
}

// ───────────── DEMO ─────────────
function viewDemo(root) {
  var box = h('textarea', { placeholder: '12345\n11111, 22222', 'aria-label': 'Demo numbers' });
  var list = h('div');
  function paint() {
    list.textContent = '';
    if (!S.demo.length) list.appendChild(h('div', { class: 'empty' }, h('b', { text: 'No demo numbers' }), 'Add a number above. It will log in without registering.'));
    S.demo.forEach(function (d) {
      list.appendChild(h('div', { class: 'line-row' },
        h('div', { class: 'grow' }, h('span', { class: 'num', text: d.n }), d.note ? h('div', { class: 't', text: String(d.note) }) : null),
        h('span', { class: 'pill ' + (d.on ? 'on' : ''), text: d.on ? 'On' : 'Off' }),
        h('button', { class: 'btn sm sw', text: d.on ? 'Turn off' : 'Turn on', onclick: function () { api('demo/toggle', { number: d.n, enabled: !d.on }).then(function () { toast(d.n + (d.on ? ' turned off' : ' turned on')); return reload(); }).catch(fail); } }),
        h('button', { class: 'btn sm danger', text: 'Delete', onclick: function () {
          ask({ title: 'Delete demo number ' + d.n + '?', confirm: 'Delete', danger: true }).then(function (a) { if (a.ok) api('demo/delete', { number: d.n }).then(function () { toast('Deleted ' + d.n); return reload(); }).catch(fail); });
        } })));
    });
  }
  add(root, [
    h('div', { class: 'card' }, h('h2', { text: 'Add demo numbers' }),
      h('p', { text: 'A demo number logs in directly: no registration check and no "not registered" popup. 2 to 20 digits. Separate several with commas, spaces or new lines.' }),
      h('label', { class: 'field' }, box),
      h('button', { class: 'btn gold', text: 'Add', onclick: function () {
        var parts = box.value.split(/[\s,;]+/).filter(Boolean);
        if (!parts.length) { toast('Enter a number first', true); return; }
        var good = parts.filter(function (p) { return /^\d{2,20}$/.test(p); }), badp = parts.filter(function (p) { return !/^\d{2,20}$/.test(p); });
        if (!good.length) { toast('Only digits, 2 to 20 long. Skipped: ' + badp.join(', '), true); return; }
        api('demo/add', { numbers: good }).then(function () { toast('Added ' + good.length + (badp.length ? ', skipped ' + badp.length + ' invalid' : '')); return reload(); }).catch(fail);
      } })),
    h('div', { class: 'card' }, h('h2', { text: S.demo.length + (S.demo.length === 1 ? ' demo number' : ' demo numbers') }), list)
  ]);
  paint();
}

// ───────────── DEPOSITS ─────────────
function depForm(d) {
  var edit = !!d;
  formModal({ title: edit ? 'Deposit requirement for ' + d.n : 'New deposit requirement',
    text: 'While PENDING, the user sees a Deposit Required popup on WinGo until their balance reaches the target.',
    fields: [
      edit ? null : { key: 'number', label: 'Mobile number', inputmode: 'numeric' },
      { key: 'requiredAmount', label: 'Amount to deposit (rupees)', inputmode: 'decimal', value: edit ? d.req : '' },
      { key: 'targetBalance', label: 'Target balance (optional)', inputmode: 'decimal', value: edit && d.target !== undefined && d.target !== null ? d.target : '', hint: 'Leave empty to use the amount as the target.' },
      { key: 'status', label: 'Status', select: [['PENDING', 'Pending (show popup)'], ['FULFILLED', 'Fulfilled'], ['CANCELLED', 'Cancelled']], value: edit && d.status ? d.status : 'PENDING' }
    ].filter(Boolean),
    submit: 'Save',
    onSubmit: function (v) {
      return api('deposit/set', { number: edit ? d.n : v.number.trim(), requiredAmount: v.requiredAmount, targetBalance: v.targetBalance, status: v.status }).then(function () { toast('Saved'); return reload(); });
    } });
}
function viewDep(root) {
  var list = h('div');
  if (!S.dep.length) list.appendChild(h('div', { class: 'empty' }, h('b', { text: 'No deposit requirements' }), 'Create one to ask a user to deposit before they continue on WinGo.'));
  S.dep.forEach(function (d) {
    var pill = d.status === 'PENDING' ? 'warn' : d.status === 'FULFILLED' ? 'on' : '';
    list.appendChild(h('div', { class: 'line-row' },
      h('div', { class: 'grow' }, h('span', { class: 'num', text: d.n }),
        h('div', { class: 't', text: 'Deposit ' + rs(d.req) + (d.target ? '  ·  target ' + rs(d.target) : '') + (d.fAt ? '  ·  done ' + fdate(d.fAt) : '') })),
      h('span', { class: 'pill ' + pill, text: d.status || 'Unknown' }),
      h('button', { class: 'btn sm', text: 'Edit', onclick: function () { depForm(d); } }),
      h('button', { class: 'btn sm danger', text: 'Delete', onclick: function () {
        ask({ title: 'Delete requirement for ' + d.n + '?', confirm: 'Delete', danger: true }).then(function (a) { if (a.ok) api('deposit/delete', { number: d.n }).then(function () { toast('Deleted'); return reload(); }).catch(fail); });
      } })));
  });
  add(root, h('div', { class: 'card' },
    h('div', { class: 'line-row' }, h('div', { class: 'grow' }, h('h2', { text: 'Deposit requirements' })), h('button', { class: 'btn gold sm', text: 'New requirement', onclick: function () { depForm(null); } })),
    list));
}

// ───────────── LOGS ─────────────
function viewLogs(root) {
  var out = h('div'), q = h('input', { type: 'search', placeholder: 'Filter logs', value: S.logQ, 'aria-label': 'Filter logs', oninput: function () { S.logQ = this.value; paint(); } });
  var seg = h('div', { class: 'seg2', role: 'group' }, [['audit', 'Activity'], ['deposit', 'Deposits']].map(function (k) {
    return h('button', { text: k[1], 'aria-pressed': S.logKind === k[0] ? 'true' : 'false', onclick: function () { S.logKind = k[0]; S.logQ = ''; renderView(); } });
  }));
  var clear = h('button', { class: 'btn sm danger', text: 'Clear all', onclick: function () {
    ask({ title: 'Clear all ' + (S.logKind === 'audit' ? 'activity' : 'deposit') + ' logs?', text: 'This cannot be undone.', confirm: 'Clear logs', danger: true }).then(function (a) {
      if (a.ok) api('logs/clear', { kind: S.logKind }).then(function () { toast('Logs cleared'); S.audit = null; S.depLogs = null; renderView(); }).catch(fail);
    });
  } });
  function paint() {
    var f = S.logQ.trim().toLowerCase(); out.textContent = '';
    if (S.logKind === 'audit') {
      var rows = (S.audit || []).filter(function (l) { return !f || (l.action + ' ' + l.target + ' ' + l.actor).toLowerCase().indexOf(f) >= 0; });
      if (!rows.length) out.appendChild(h('div', { class: 'empty' }, h('b', { text: 'No activity' }), 'Logins, deposits and admin actions show up here.'));
      rows.slice(0, 200).forEach(function (l) {
        out.appendChild(h('div', { class: 'logline' }, h('span', { class: 'a', text: l.action }), '  ', h('span', { text: l.target }),
          h('span', { class: 't', text: (l.actor || '') + '  ·  ' + (l.ts ? fdate(l.ts) + '  ·  ' + ago(l.ts) : '') })));
      });
    } else {
      var d = (S.depLogs || []).filter(function (l) { return !f || (l.n + ' ' + l.source).toLowerCase().indexOf(f) >= 0; });
      if (!d.length) out.appendChild(h('div', { class: 'empty' }, h('b', { text: 'No deposits detected' }), 'The app logs a deposit when a wallet jumps by more than the minimum in Config.'));
      d.slice(0, 200).forEach(function (l) {
        out.appendChild(h('div', { class: 'logline' }, h('span', { class: 'a', text: '+' + rs(l.amount) }), '  ', h('span', { class: 'num', text: l.n }),
          h('span', { class: 't', text: rs(l.prev) + ' to ' + rs(l.next) + '  ·  ' + fdate(l.ts) + '  ·  ' + (l.source || '') })));
      });
    }
  }
  add(root, h('div', { class: 'card' }, h('div', { class: 'bar' }, seg, h('div', { class: 'grow' }), clear), h('div', { class: 'bar' }, h('div', { class: 'grow' }, q)), out));
  if (S.logKind === 'audit') {
    if (S.audit) paint(); else { out.textContent = 'Loading…';
      api('data/AuditLogs?limit=300').then(function (r) {
        S.audit = entries(r).map(function (e) { var v = isObj(e[1]) ? e[1] : {}; return { action: String(v.action || ''), target: String(v.target === undefined ? '' : v.target), actor: String(v.actor || ''), ts: Number(v.timestamp) || 0 }; })
          .sort(function (a, b) { return b.ts - a.ts; });
        if (S.tab === 'logs') paint();
      }).catch(fail); }
  } else {
    if (S.depLogs) paint(); else { out.textContent = 'Loading…';
      api('data/DepositLogs').then(function (r) {
        var all = [];
        entries(r).forEach(function (u) { entries(u[1]).forEach(function (e) { var v = isObj(e[1]) ? e[1] : {}; all.push({ n: u[0], amount: v.amount, prev: v.prevBalance, next: v.newBalance, ts: Number(v.detectedAt) || 0, source: String(v.source || '') }); }); });
        S.depLogs = all.sort(function (a, b) { return b.ts - a.ts; });
        if (S.tab === 'logs') paint();
      }).catch(fail); }
  }
}

// ───────────── CONFIG ─────────────
function viewCfg(root) {
  var tg = h('input', { type: 'url', value: S.cfg.telegramLink === undefined ? '' : String(S.cfg.telegramLink), placeholder: 'https://t.me/yourchannel', autocomplete: 'off' });
  var md = h('input', { type: 'text', inputmode: 'decimal', value: S.cfg.minDepositDetect === undefined ? '' : String(S.cfg.minDepositDetect), placeholder: '50', autocomplete: 'off' });
  var others = Object.keys(S.cfg).filter(function (k) { return k !== 'telegramLink' && k !== 'minDepositDetect'; });
  add(root, h('div', { class: 'card' }, h('h2', { text: 'App settings' }), h('p', { text: 'The app reads these when it needs them.' }),
    h('label', { class: 'field' }, h('span', { text: 'Telegram link' }), tg),
    h('label', { class: 'field' }, h('span', { text: 'Minimum deposit to log (rupees)' }), md, h('small', { text: 'A wallet jump smaller than this is treated as a win, not a deposit.' })),
    h('button', { class: 'btn gold', text: 'Save settings', onclick: function () {
      var body = { telegramLink: tg.value };
      if (md.value.trim() !== '') body.minDepositDetect = md.value.trim();
      api('config/set', body).then(function () { toast('Settings saved'); return reload(); }).catch(fail);
    } })),
    others.length ? h('div', { class: 'card' }, h('h2', { text: 'Other keys in Config' }), h('p', { text: 'Read only here.' }),
      kv(others.map(function (k) { return [k, typeof S.cfg[k] === 'object' ? JSON.stringify(S.cfg[k]) : String(S.cfg[k])]; }))) : null);
}

// ───────────── TOOLS ─────────────
function viewTools(root) {
  var bad = S.users.filter(function (u) { return u.issues.length; });
  var prog = h('div', { class: 'hint' });
  var totalBal = S.users.reduce(function (a, u) { return a + u.bal; }, 0);
  add(root, [
    h('div', { class: 'card' }, h('h2', { text: 'Overview' }),
      h('div', { class: 'stat' },
        h('div', null, h('b', { text: String(S.users.length) }), h('span', { text: 'users' })),
        h('div', null, h('b', { text: String(S.users.filter(function (u) { return u.st === 'ACTIVE'; }).length) }), h('span', { text: 'active' })),
        h('div', null, h('b', { text: String(S.users.filter(function (u) { return u.st !== 'ACTIVE'; }).length) }), h('span', { text: 'not active' })),
        h('div', null, h('b', { text: rs(totalBal) }), h('span', { text: 'total balance (copy)' })))),
    h('div', { class: 'card' }, h('h2', { text: 'Backup' }),
      h('p', { text: 'Downloads users, demo numbers, deposit requirements, settings and recent logs as one JSON file. Keep it private: it contains passwords.' }),
      h('button', { class: 'btn gold', text: 'Download backup', onclick: function () {
        var names = ['Users', 'dbRef', 'DemoAccounts', 'DepositRequired', 'DepositLogs', 'Config', 'AuditLogs'];
        Promise.all(names.map(function (n) { return api('data/' + n + (n === 'AuditLogs' ? '?limit=1000' : '')); })).then(function (r) {
          var data = {}; names.forEach(function (n, i) { data[n] = r[i]; });
          download('funxpro-backup-' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.json', JSON.stringify({ exportedAt: new Date().toISOString(), data: data }, null, 2), 'application/json');
          toast('Backup downloaded');
        }).catch(fail);
      } })),
    h('div', { class: 'card' }, h('h2', { text: 'Record check' }),
      h('p', { text: bad.length ? bad.length + ' record' + (bad.length === 1 ? '' : 's') + ' can break login or balance sync (missing mobile field, or stored in only one place).' : 'All records look good.' }),
      bad.slice(0, 8).map(function (u) { return h('div', { class: 'line-row' }, h('div', { class: 'grow' }, h('span', { class: 'num', text: u.n }), h('div', { class: 't', text: u.issues.join('. ') })),
        h('button', { class: 'btn sm', text: 'Open', onclick: function () { S.tab = 'users'; S.filter = 'all'; S.q = u.n; S.open = u.n; renderTabs(); renderView(); } })); }),
      bad.length > 8 ? h('div', { class: 'hint', text: 'and ' + (bad.length - 8) + ' more' }) : null,
      bad.length ? h('button', { class: 'btn gold', text: 'Fix all ' + bad.length, onclick: function () { prog.textContent = 'Fixing…'; repair(bad.map(function (u) { return u.n; })); } }) : null, prog)
  ]);
}

// ───────────── start ─────────────
if (DIRECT) { directStart(); return; }
var saved = getStored();
if (HOSTED) S.base = cleanBase(getBase());
if (saved && (!HOSTED || S.base)) { S.secret = saved; boot().catch(function () { showLock(''); }); } else showLock('');
})();
